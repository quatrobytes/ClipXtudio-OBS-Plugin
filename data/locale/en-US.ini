Settings.Section.Help.settingsGeneralSection="Choose how ClipXtudio starts, opens and follows your OBS workflow."
Settings.Section.Help.settingsCaptureSection="Define what is saved around each capture and which output versions ClipXtudio prepares."
Settings.Section.Help.settingsReplayPerformanceSection="Choose the video encoder used by the active OBS profile and control its native Replay Buffer from one place."
Settings.Section.Help.settingsPathsSection="Choose where original clips, processed exports and thumbnails are stored on this computer."
Settings.Section.Help.settingsFileNamesSection="Control the readable name ClipXtudio assigns to each saved video."
Settings.Section.Help.settingsNotificationsSection="Choose how ClipXtudio confirms completed captures. These preferences apply immediately."
Settings.Section.Help.settingsHotkeysSection="Click a shortcut field, press the desired combination, then release it. ClipXtudio applies it to OBS immediately and it works even when the dock is not focused."
Settings.Section.Help.settingsExportSection="Configure processed copies created for vertical delivery or other platforms. Original Replay Buffer files are not re-encoded by these options."
Settings.Section.Help.settingsIntegrationsSection="Connect supported streaming services so Chat Pulse can analyze live chat activity."
Settings.Section.Help.settingsAiSection="AI can generate titles, captions, summaries and subtitle text from a transcript. It is optional, requires consent and is controlled by your plan."
Settings.Section.Help.settingsProAccountSection="Activate Pro on this device or open your web account to review billing and membership status."
Settings.Section.Help.settingsSupportSection="Open a pre-filled secure support form to report a problem or suggest an improvement."
Settings.Help.settingsReplayEncoderCombo="Hardware encoders move video encoding to the GPU and normally reduce CPU usage while Replay Buffer is active."
Settings.Help.settingsReplayEnabledCheck="Enable the native Replay Buffer for the active OBS profile. ClipXtudio reuses this single buffer for horizontal and vertical clips."
Settings.Help.pluginLanguageCombo="Changes all plugin text. The dock rebuilds immediately while preserving the selected tab."
Settings.Help.startWithObsCheck="Loads ClipXtudio whenever OBS starts. It does not start recording or streaming."
Settings.Help.openDockAtStartupCheck="Shows the ClipXtudio dock automatically after OBS finishes loading."
Settings.Help.autoStartReplayCheck="Starts the native OBS Replay Buffer automatically when the current profile supports it."
Settings.Help.defaultDurationSpin="The duration selected initially for manual Save Clip actions."
Settings.Help.preRollSpin="Seconds kept before a smart trigger or marked moment."
Settings.Help.postRollSpin="Seconds collected after a trigger before ClipXtudio requests the saved replay."
Settings.Help.captureOutputModeCombo="Horizontal keeps the OBS replay, Vertical prepares a 9:16 copy, and Both keeps both versions."
Settings.Help.freeClipLimitSpin="Maximum clips available in one Free session. This policy value cannot be edited locally."
Settings.Help.confirmDeleteCheck="Requires confirmation before a clip and its associated local files are permanently removed."
Settings.Help.clipDirectoryEdit="Folder containing original clips saved by the OBS Replay Buffer."
Settings.Help.exportDirectoryEdit="Folder containing processed horizontal or vertical copies created by ClipXtudio."
Settings.Help.thumbnailDirectoryEdit="Folder containing preview images generated for the clip library."
Settings.Help.includeDateCheck="Adds the capture date to generated file names."
Settings.Help.includeScoreCheck="Adds the current Clip Score when a score is available."
Settings.Help.includeTriggerCheck="Adds manual, voice, scene, chat or the detected trigger label."
Settings.Help.includeOrientationCheck="Adds horizontal, vertical or both to the file name."
Settings.Help.fileNameTemplateEdit="Controls component order. Supported placeholders include {date}, {time}, {title}, {trigger}, {score} and {orientation}."
Settings.Help.insideObsNotificationCheck="Shows a compact confirmation inside the ClipXtudio dock after saving."
Settings.Help.soundOnSaveCheck="Plays the OBS application notification sound after a successful save."
Settings.Help.systemToastCheck="Shows a desktop notification after a successful save when the operating system tray is available."
Settings.Help.notificationDetailCombo="Compact shows only success, Standard includes the file name, and Detailed includes duration and save location."
Settings.Help.markMomentHotkeyEdit="Creates a manual moment using the configured default duration."
Settings.Help.save15HotkeyEdit="Saves the last 15 seconds from the active OBS Replay Buffer."
Settings.Help.save30HotkeyEdit="Saves the last 30 seconds from the active OBS Replay Buffer."
Settings.Help.save60HotkeyEdit="Saves the last 60 seconds from the active OBS Replay Buffer."
Settings.Help.saveVerticalHotkeyEdit="Saves a clip and queues its 9:16 version when Pro vertical mode is available."
Settings.Help.openDesignerHotkeyEdit="Opens or closes the ClipXtudio dock from anywhere in OBS."
Settings.Help.exportFormatCombo="Container used for processed copies. MP4 is the most broadly compatible."
Settings.Help.exportCodecCombo="Video codec for processed copies. Hardware support depends on the installed FFmpeg build and GPU."
Settings.Help.exportFpsCombo="Frame rate of processed copies. Higher FPS requires more processing and storage."
Settings.Help.exportQualityCombo="Balances visual quality, file size and export time."
Settings.Help.verticalResolutionCombo="Target resolution for processed 9:16 copies. Higher resolutions require substantially more GPU, memory and storage."
Settings.Help.aiAssistantEnabledCheck="Allows ClipXtudio to request AI results through the secured ClipXtudio backend."
Settings.Help.aiPrivacyConsentCheck="Required consent to send transcript text and clip identifiers; video and local file paths are not sent."
Settings.Help.aiLanguageCombo="Selects the language used for generated titles, captions, summaries and subtitle text."
